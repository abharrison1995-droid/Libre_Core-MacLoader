name: Upstream candidates

on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:
    inputs:
      publish_proposal:
        description: Create a draft review PR after every gate passes
        type: boolean
        default: false
  push:
    paths:
      - '.github/workflows/upstream-candidates.yml'
      - 'macloader/maintenance/**'
      - 'tests/unit/test_upstream_updates.py'
      - 'tests/unit/test_cli.py'
      - 'tests/unit/test_guided.py'
      - 'macloader/ui/guided.py'
      - 'tests/unit/test_autoloader_build.py'

permissions:
  contents: read

concurrency:
  group: upstream-candidates
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      candidate: ${{ steps.prepare.outputs.candidate }}
      base: ${{ steps.prepare.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Read authoritative releases and verify isolated candidate
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python -m macloader.maintenance.upstream --output .candidate-work
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          report = json.loads(Path('.candidate-work/report.json').read_text())
          candidate = Path(report['candidate_directory']).name if report['candidate_directory'] else ''
          if candidate and not re.fullmatch(r'[0-9a-f]{64}', candidate):
              raise ValueError('Invalid generated candidate identity')
          base = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as handle:
              handle.write(f'candidate={candidate}\nbase={base}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-candidate
          path: |
            .candidate-work/report.json
            .candidate-work/report.md
            .candidate-work/candidates/
          if-no-files-found: error

  candidate-matrix:
    needs: prepare
    if: needs.prepare.outputs.candidate != ''
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: upstream-candidate
          path: .candidate-work
      - run: python -m pip install -e '.[dev]' build
      - name: Validate isolated catalog and graph
        env:
          CANDIDATE_ID: ${{ needs.prepare.outputs.candidate }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from macloader.maintenance.upstream import overlay
          overlay(Path('.candidate-work/candidates') / os.environ['CANDIDATE_ID'], Path('.candidate-data'))
          PY
      - name: Functional tests, types and canonical coverage
        shell: bash
        run: |
          python -m pytest -q --cov=macloader --cov-branch --cov-report=xml --cov-fail-under=0
          python -m mypy macloader tests --follow-imports=skip
      - name: Canonical coverage gate
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: python -m coverage report --fail-under=79
      - name: Candidate dependency acquisition, reference EFI and matching ocvalidate
        env:
          MACLOADER_CANDIDATE_DATA_DIR: .candidate-data
          MACLOADER_VERIFY_CANDIDATE_ASSETS: '1'
          MACLOADER_VERIFY_PINNED_TOOLS: '1'
        shell: bash
        run: |
          python -c "from macloader.toolchain.loader import TrustedToolchainLoader; TrustedToolchainLoader().provision()"
          python -m pytest -q tests/unit/test_autoloader_build.py::test_profiled_builder_consumes_generated_map_and_binds_manifest
      - name: Package gates
        shell: bash
        run: |
          python -m build --wheel --sdist
          python tests/package_smoke.py --artifact "$(find dist -name '*.whl' -print -quit)" --fixture "${{ github.workspace }}/tests/fixtures/t480s/t480s_baseline.json"
          python tests/package_smoke.py --artifact "$(find dist -name '*.tar.gz' -print -quit)" --fixture "${{ github.workspace }}/tests/fixtures/t480s/t480s_baseline.json"

  propose:
    needs: [prepare, candidate-matrix]
    if: needs.prepare.outputs.candidate != '' && needs.candidate-matrix.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: upstream-candidate
          path: .candidate-work
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Prepare review-only proposal after every gate
        env:
          CANDIDATE_ID: ${{ needs.prepare.outputs.candidate }}
          BASE_COMMIT: ${{ needs.prepare.outputs.base }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, shutil, subprocess
          from pathlib import Path
          candidate = os.environ['CANDIDATE_ID']
          if not re.fullmatch(r'[0-9a-f]{64}', candidate):
              raise ValueError('Invalid proposal identity')
          source = Path('.candidate-work/candidates') / candidate
          target = Path('maintenance/candidates') / candidate
          shutil.copytree(source, target)
          report = json.loads(Path('.candidate-work/report.json').read_text())
          report.update(proposal_ready=True, ci_run=os.environ['RUN_URL'], base_commit=os.environ['BASE_COMMIT'])
          (target / 'report.json').write_text(json.dumps(report, indent=2))
          text = Path('.candidate-work/report.md').read_text()
          text += '\nAll software gates passed: ' + os.environ['RUN_URL'] + '\n\nThis is an isolated catalog proposal. Production policy remains unchanged. Human catalog/license review and later physical acceptance remain required. No auto-merge.\n'
          (target / 'report.md').write_text(text)
          Path('.candidate-work/pr-body.md').write_text(text)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: verified-candidate-report
          path: maintenance/candidates/
          if-no-files-found: error
      - name: Create draft PR without overwriting existing proposal
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish_proposal)
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ID: ${{ needs.prepare.outputs.candidate }}
          BASE_COMMIT: ${{ needs.prepare.outputs.base }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          branch="codex/upstream-${CANDIDATE_ID:0:16}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
            echo 'Existing proposal is preserved; review it before proposing again.'
            exit 0
          fi
          current_base=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${DEFAULT_BRANCH}" --jq '.object.sha')
          test "$current_base" = "$BASE_COMMIT"
          git switch -c "$branch"
          git add "maintenance/candidates/$CANDIDATE_ID"
          git commit -m 'Propose verified dependency candidate for review'
          gh auth setup-git
          git push origin "$branch"
          gh pr create --draft --base "$DEFAULT_BRANCH" --head "$branch" --title 'Review verified dependency candidate' --body-file .candidate-work/pr-body.md
