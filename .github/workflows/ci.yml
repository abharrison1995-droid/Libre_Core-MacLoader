name: verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q --cov=macloader --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=79
      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
      - name: Run type checks
        run: python -m mypy macloader tests --follow-imports=skip

  toolchain-integration:
    # Provisions the catalog-pinned toolchain into a clean workspace (the
    # ACPICA iASL is rebuilt from source and must reproduce the pinned digest),
    # then runs the real EFI builder on synthetic, software-only inputs and
    # validates the result with the matching pinned ocvalidate.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build prerequisites for the pinned iASL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bison flex m4
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Clean-workspace provisioning and real ocvalidate integration
        env:
          MACLOADER_NETWORK_TESTS: '1'
          MACLOADER_WORKSPACE: ${{ runner.temp }}/macloader-workspace
        run: python -m pytest -q -rs tests/integration/test_toolchain_efi_integration.py

  wheel-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and install wheel
        shell: bash
        run: |
          python -m pip install build
          python -m build --wheel --sdist
      - name: Wheel smoke outside the checkout
        shell: bash
        run: |
          python tests/package_smoke.py --artifact "$(find dist -name '*.whl' -print -quit)" --fixture "${{ github.workspace }}/tests/fixtures/t480s/t480s_baseline.json"
      - name: Sdist smoke outside the checkout
        shell: bash
        run: |
          python tests/package_smoke.py --artifact "$(find dist -name '*.tar.gz' -print -quit)" --fixture "${{ github.workspace }}/tests/fixtures/t480s/t480s_baseline.json"
